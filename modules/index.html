<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Course Enrollment | The Master Intern Series</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f6f9; color: #333; }
        .text-gradient {
            background: linear-gradient(315deg, #1e3c72 0%, #2a5298 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bg-gradient-primary-to-secondary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%) !important;
        }
        .card { border-radius: 1rem; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .accordion-item { border-radius: 0.75rem !important; margin-bottom: 0.5rem; border: 1px solid rgba(0,0,0,0.08) !important; overflow: hidden; background-color: #fff; }
        .accordion-button:not(.collapsed) { background-color: #f0f4f8; color: #1e3c72; font-weight: 600; }
        
        /* Mobile-Safe Stacked Time Formatting */
        .session-time-block { padding: 6px 0; }
        .session-time-block:not(:last-child) { border-bottom: 1px dashed #e3e6ec; }
        .time-display { font-size: 0.88rem; color: #212529; font-weight: 600; display: block; }
        .tz-label-suffix { color: #0d6efd; font-weight: 700; white-space: nowrap; }
        .timezone-badge { font-size: 0.8rem; padding: 0.4rem 0.75rem; border-radius: 2rem; font-weight: 600; }
        .search-input:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); }
    </style>
</head>
<body class="py-4 py-md-5">

    <div class="container" style="max-width: 850px;">
        <div class="text-center mb-5">
            <div class="d-inline-flex bg-primary text-white p-3 rounded-circle mb-3">
                <i class="bi bi-journal-plus fs-3"></i>
            </div>
            <h1 class="fw-bold h2">Course Enrollment Hub</h1>
            <p class="text-muted small px-3">
                Select an overarching series below to enroll in its full schedule block via its designated Google Form.
            </p>
            <div class="mt-3">
                <a href="#timezone"><span class="bg-dark text-white timezone-badge shadow-sm d-inline-flex align-items-center gap-2">
                    <span id="currentTimezoneFlag">🇬🇧</span> 
                     Session Timezone: <span id="currentTimezoneLabel" class="fw-bold text-warning">GMT</span>
                </span></a>
                <p class="small text-muted mt-2">Click <a href="#timezone">here</a> to change to a timezone where you're located!</p>
            </div>
        </div>

        <div class="card bg-white p-3 mb-4 border-0 shadow-sm">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-search"></i></span>
                <input type="text" id="enrollSearchInput" class="form-control p-2.5 border-start-0 search-input" placeholder="Search topics or keywords (e.g., 'ECG', 'Stroke', 'Module B')..." onkeyup="filterEnrollmentSyllabus()" disabled />
            </div>
        </div>

        <div id="modulesEnrollmentContainer" class="d-flex flex-column gap-4">
            <div class="card bg-white p-5 text-center">
                <div class="spinner-border text-primary spinner-border-sm mx-auto" role="status"></div>
                <p class="text-muted small mt-2 m-0">Synchronizing database program matrices...</p>
            </div>
        </div>

        <footer class="mt-5 d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 px-2">
            <a href="index.html" class="btn btn-sm btn-outline-secondary rounded-3 px-3"><i class="bi bi-arrow-left me-1"></i> Return to Main Website</a>
            
            <div id="timezone" class="d-flex align-items-center gap-2 border bg-white p-2 rounded shadow-sm" style="font-size: 0.85rem;">
                <label for="globalTimezoneSelectorInput" class="small fw-bold text-muted mb-0 text-uppercase flex-shrink-0" style="font-size: 0.68rem;"><i class="bi bi-clock text-primary"></i> Timezone:</label>
                <select id="globalTimezoneSelectorInput" class="form-select form-select-sm bg-white border-0 fw-bold shadow-none p-0 ps-1 text-dark" style="width: auto; cursor:pointer;" onchange="updateTimezoneContext(this.value)">
                    <option value="UTC">🇬🇧 GMT / UTC Base</option>
                    <option value="Asia/Dubai">🇦🇪 UAE / GST (Dubai)</option>
                    <option value="Europe/Berlin">🇩🇪 Germany / CET (Berlin)</option>
                    <option value="Asia/Kolkata">🇮🇳 India / IST (New Delhi)</option>
                </select>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Data spreadsheet source paths endpoints
        const CSV_MODULES_LIST_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxA15mAShGjlNunP9bW3I5lJYMd73ecjNi3HplpQMN1sLp_Vk-VxTZdNpUMkX6lHvw24_rX0_u6M_7/pub?gid=0&single=true&output=csv";
        const CSV_TOPICS_LIST_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxA15mAShGjlNunP9bW3I5lJYMd73ecjNi3HplpQMN1sLp_Vk-VxTZdNpUMkX6lHvw24_rX0_u6M_7/pub?gid=601406273&single=true&output=csv";

        // Global state memory instances
        let globalModulesDataCache = [];
        let globalTopicsDataCache = [];
        let currentActiveTimezone = "UTC";

        // Location data flag dictionaries
        const timezoneMetadataDictionary = {
            "UTC": { flag: "🇬🇧", label: "GMT / UTC Base", suffix: "GMT" },
            "Asia/Dubai": { flag: "🇦🇪", label: "UAE (GST)", suffix: "GST" },
            "Europe/Berlin": { flag: "🇩🇪", label: "Germany (CET)", suffix: "CET" },
            "Asia/Kolkata": { flag: "🇮🇳", label: "India (IST)", suffix: "IST" }
        };

        // Application Cookie Helpers
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Strict";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }

        // Initialize App Runtime
        document.addEventListener("DOMContentLoaded", function() {
            const savedTz = getCookie("user_ward_timezone");
            if (savedTz && timezoneMetadataDictionary[savedTz]) {
                currentActiveTimezone = savedTz;
            } else {
                currentActiveTimezone = "UTC";
            }
            document.getElementById("globalTimezoneSelectorInput").value = currentActiveTimezone;
            
            loadEnrollmentDataPipeline();
        });

        function loadEnrollmentDataPipeline() {
            Papa.parse(CSV_MODULES_LIST_URL, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(modulesRes) {
                    globalModulesDataCache = modulesRes.data;
                    
                    Papa.parse(CSV_TOPICS_LIST_URL, {
                        download: true, header: true, skipEmptyLines: true,
                        complete: function(topicsRes) {
                            globalTopicsDataCache = topicsRes.data;
                            document.getElementById("enrollSearchInput").disabled = false;
                            renderEnrollmentSyllabusEngine(globalTopicsDataCache);
                        }
                    });
                }
            });
        }

        // Parse date values into narrow mobile strings
        function formatDateTimeString(gmtDateStr, targetTimezone) {
            if (!gmtDateStr || gmtDateStr.trim() === "" || gmtDateStr.trim().toUpperCase() === "TBD" || gmtDateStr.trim().toUpperCase() === "NAN") {
                return '<span class="badge bg-secondary text-uppercase">TBD</span>';
            }
            try {
                let dt = luxon.DateTime.fromFormat(gmtDateStr.trim(), "yyyy-MM-dd HH:mm", { zone: "utc" });
                if (!dt.isValid) dt = luxon.DateTime.fromISO(gmtDateStr.trim(), { zone: "utc" });

                if (!dt.isValid) return gmtDateStr;

                const localTime = dt.setZone(targetTimezone);
                const tzMeta = timezoneMetadataDictionary[targetTimezone] || { flag: "🌐", suffix: localTime.toZoneName() };
                
                return `<span class="time-display">${localTime.toFormat("ccc, LLL d 'at' HH:mm")} <span class="tz-label-suffix">${tzMeta.flag} ${tzMeta.suffix}</span></span>`;
            } catch (e) {
                return gmtDateStr;
            }
        }

        // Core compilation loops assembling grouped module items arrays
        function renderEnrollmentSyllabusEngine(filteredTopicsList) {
            const container = document.getElementById("modulesEnrollmentContainer");
            const tzLabel = document.getElementById("currentTimezoneLabel");
            const tzFlag = document.getElementById("currentTimezoneFlag");
            
            const meta = timezoneMetadataDictionary[currentActiveTimezone] || { flag: "🌐", label: currentActiveTimezone };
            tzLabel.textContent = meta.label;
            tzFlag.textContent = meta.flag;

            if (globalModulesDataCache.length === 0) {
                container.innerHTML = `<div class="alert alert-danger text-center small">Failed to load registration data rows.</div>`;
                return;
            }

            container.innerHTML = "";

            let cardsRenderedCount = 0;

            globalModulesDataCache.forEach((moduleItem, moduleIdx) => {
                const moduleCode = moduleItem["Module"] || `M-${moduleIdx}`;
                const moduleName = moduleItem["Module Name"] || "Unnamed Module";
                const moduleDesc = moduleItem["Module Description"] || "";
                const moduleStatus = moduleItem["Status"] || "TBD";
                const enrollmentFormLinkUrl = moduleItem["Form Link"] || "#";
                
                // Track topics corresponding to this parent container series
                const subtopics = filteredTopicsList.filter(t => t["Module"] === moduleCode);
                
                if (subtopics.length === 0) return;

                cardsRenderedCount++;

                let accordionItemsHtml = "";
                
                subtopics.forEach((topic, topicIdx) => {
                    const titleStr = topic["Topic Title"] || "Untitled Topic";
                    const descStr = topic["Topic Description"] || "";
                    const liveTime = topic["Date Time"];
                    const repeatTime = topic["Date Time (Repeat)"];
                    const uniqueAccordionId = `collapse-enroll-${moduleCode}-${topicIdx}`;

                    let timeRowsBlockHtml = "";
                    if (liveTime && liveTime.trim().toUpperCase() !== "TBD") {
                        timeRowsBlockHtml += `
                            <div class="session-time-block">
                                <small class="text-muted text-uppercase fw-bold d-block" style="font-size:0.65rem;"><i class="bi bi-calendar2-check-fill text-primary"></i> Live Class Session</small>
                                ${formatDateTimeString(liveTime, currentActiveTimezone)}
                            </div>`;
                    }
                    if (repeatTime && repeatTime.trim().toUpperCase() !== "TBD") {
                        timeRowsBlockHtml += `
                            <div class="session-time-block">
                                <small class="text-muted text-uppercase fw-bold d-block" style="font-size:0.65rem;"><i class="bi bi-arrow-repeat text-info"></i> Shift Worker Repeat Option</small>
                                ${formatDateTimeString(repeatTime, currentActiveTimezone)}
                            </div>`;
                    }
                    if (!timeRowsBlockHtml) {
                        timeRowsBlockHtml = `
                            <div class="session-time-block py-1">
                                <small class="text-muted text-uppercase fw-bold d-block" style="font-size:0.65rem;"><i class="bi bi-calendar-x text-secondary"></i> Schedule Timeline</small>
                                <span class="badge bg-secondary text-uppercase mt-1">TBD</span>
                            </div>`;
                    }

                    // Keep the first topic entry of Module A expanded initially for UI layout presentation depth
                    const expandState = (moduleCode === "A" && topicIdx === 0) ? "show" : "";
                    const buttonCollapsedClass = (moduleCode === "A" && topicIdx === 0) ? "" : "collapsed";

                    accordionItemsHtml += `
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading-${uniqueAccordionId}">
                                <button class="accordion-button font-weight-bold ${buttonCollapsedClass}" type="button" data-bs-toggle="collapse" data-bs-target="#${uniqueAccordionId}" aria-expanded="${expandState ? 'true' : 'false'}" aria-controls="${uniqueAccordionId}">
                                    ${titleStr}
                                </button>
                            </h2>
                            <div id="${uniqueAccordionId}" class="accordion-collapse collapse ${expandState}" aria-labelledby="heading-${uniqueAccordionId}" data-bs-parent="#accordion-parent-${moduleCode}">
                                <div class="accordion-body text-secondary small p-3">
                                    ${descStr ? `<p class="mb-3 text-dark fw-medium" style="font-size: 0.85rem; line-height: 1.45;">${descStr}</p>` : ''}
                                    <div class="px-3 py-2 bg-white rounded border border-light shadow-sm">
                                        ${timeRowsBlockHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const moduleCardTemplateHtml = `
                    <div class="card bg-white border-0 shadow-sm overflow-hidden mb-2">
                        <div class="p-4 p-md-5">
                            <div class="d-md-flex justify-content-between align-items-start mb-4">
                                <div>
                                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-20 px-2.5 py-1.5 fw-bold mb-2 d-inline-block">Module ${moduleCode}</span>
                                    <h3 class="fw-bolder text-dark h4 m-0">${moduleName}</h3>
                                </div>
                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-20 px-3 py-2 text-uppercase tracking-wider mt-2 mt-md-0 d-inline-block" style="font-size:0.68rem;"><i class="bi bi-calendar-check me-1"></i>${moduleStatus || 'TBD'}</span>
                            </div>
                            <p class="text-muted mb-4 small" style="line-height:1.5;">${moduleDesc}</p>
                            
                            <div class="accordion mb-4" id="accordion-parent-${moduleCode}">
                                ${accordionItemsHtml}
                            </div>
                            
                            <a href="${enrollmentFormLinkUrl}" target="_blank" class="btn ${moduleCode === 'A' ? 'btn-primary' : 'btn-outline-primary'} rounded-3 w-100 py-2.5 fw-bold text-uppercase" style="font-size:0.78rem; letter-spacing:0.02em;">
                                <i class="bi bi-person-plus-fill me-1"></i> Register For Module ${moduleCode} | Free
                            </a>
                        </div>
                    </div>
                `;
                
                container.innerHTML += moduleCardTemplateHtml;
            });

            if (cardsRenderedCount === 0) {
                container.innerHTML = `<div class="p-4 text-center bg-white card rounded text-muted small border-0 shadow-sm">No series modules matched your current query terms.</div>`;
            }
        }

        // Typing Filter Execution Engine
        function filterEnrollmentSyllabus() {
            const query = document.getElementById("enrollSearchInput").value.toLowerCase().trim();
            
            if (query === "") {
                renderEnrollmentSyllabusEngine(globalTopicsDataCache);
                return;
            }

            const matchedTopics = globalTopicsDataCache.filter(row => {
                const title = (row["Topic Title"] || "").toLowerCase();
                const desc = (row["Topic Description"] || "").toLowerCase();
                const parentCode = (row["Module"] || "").toLowerCase();
                const comboCodeStr = `module ${parentCode}`;

                return title.includes(query) || desc.includes(query) || parentCode === query || comboCodeStr.includes(query);
            });

            renderEnrollmentSyllabusEngine(matchedTopics);
        }

        // Global state mutator action items
        function updateTimezoneContext(selectedZone) {
            currentActiveTimezone = selectedZone;
            setCookie("user_ward_timezone", selectedZone, 30);
            filterEnrollmentSyllabus();
        }
    </script>
</body>
</html>
